spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/walletdb
    username: wallet
    password: wallet
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    clean-disabled: false

app:
  jwt:
    secret: test-secret-key-with-at-least-thirty-two-bytes
    expiration-seconds: 3600
  cors:
    allowed-origin-patterns:
      - http://localhost:*
